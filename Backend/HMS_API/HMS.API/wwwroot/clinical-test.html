<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Module - Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #e0e0e0;
            border: none;
            border-radius: 5px 5px 0 0;
            font-size: 14px;
        }
        .tab:hover {
            background: #d0d0d0;
        }
        .tab.active {
            background: #3498db;
            color: white;
        }
        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #2980b9;
        }
        .response {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        .alert {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .alert.warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }
        .alert.critical {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        .alert.normal {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        .alert-level {
            font-weight: bold;
            text-transform: uppercase;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clinical Module - Test Client</h1>
        <p class="subtitle">Test Vitals Capture, Validation, and Dynamic Form Builder APIs</p>

        <div class="tabs">
            <button class="tab active" onclick="showTab('vitals')">Vitals Capture</button>
            <button class="tab" onclick="showTab('validation')">Vitals Validation</button>
            <button class="tab" onclick="showTab('templates')">Form Templates</button>
        </div>

        <!-- Vitals Capture Tab -->
        <div id="vitals" class="tab-content active">
            <h2>Record Patient Vitals</h2>
            <div class="form-group">
                <label>Patient ID</label>
                <input type="number" id="vitalPatientId" value="1" required>
            </div>
            <div class="form-group">
                <label>Consultation ID (Optional)</label>
                <input type="number" id="vitalConsultationId" placeholder="Leave blank for standalone">
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Systolic BP (mmHg)</label>
                    <input type="number" id="vitalBpSystolic" placeholder="90-180" min="50" max="300">
                </div>
                <div class="form-group">
                    <label>Diastolic BP (mmHg)</label>
                    <input type="number" id="vitalBpDiastolic" placeholder="60-110" min="30" max="200">
                </div>
                <div class="form-group">
                    <label>Heart Rate (bpm)</label>
                    <input type="number" id="vitalHeartRate" placeholder="50-120" min="30" max="220">
                </div>
                <div class="form-group">
                    <label>Temperature (°C)</label>
                    <input type="number" id="vitalTemperature" placeholder="35.0-39.0" step="0.1" min="30" max="45">
                </div>
                <div class="form-group">
                    <label>SpO2 (%)</label>
                    <input type="number" id="vitalSpo2" placeholder="90-100" min="70" max="100">
                </div>
            </div>
            <button onclick="saveVital()">Save Vitals</button>
            <button onclick="getPatientVitals()">Get Patient Vitals History</button>
            <div id="vitalResponse" class="response"></div>
        </div>

        <!-- Vitals Validation Tab -->
        <div id="validation" class="tab-content">
            <h2>Validate Vitals Data</h2>
            <div class="form-group">
                <label>Systolic BP (mmHg)</label>
                <input type="number" id="valBpSystolic" placeholder="90-180">
            </div>
            <div class="form-group">
                <label>Diastolic BP (mmHg)</label>
                <input type="number" id="valBpDiastolic" placeholder="60-110">
            </div>
            <div class="form-group">
                <label>Heart Rate (bpm)</label>
                <input type="number" id="valHeartRate" placeholder="50-120">
            </div>
            <div class="form-group">
                <label>Temperature (°C)</label>
                <input type="number" id="valTemperature" placeholder="35.0-39.0" step="0.1">
            </div>
            <div class="form-group">
                <label>SpO2 (%)</label>
                <input type="number" id="valSpo2" placeholder="90-100">
            </div>
            <button onclick="validateVitals()">Validate</button>
            <button onclick="getAlertRules()">Get Alert Rules</button>
            <div id="validationResponse"></div>
        </div>

        <!-- Form Templates Tab -->
        <div id="templates" class="tab-content">
            <h2>Create Form Template</h2>
            <div class="form-group">
                <label>Template Title</label>
                <input type="text" id="templateTitle" placeholder="e.g., Triage Assessment">
            </div>
            <div class="row">
                <div class="col form-group">
                    <label>Active</label>
                    <select id="templateActive">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label>Version</label>
                    <input type="number" id="templateVersion" value="1">
                </div>
            </div>
            <h3>Fields</h3>
            <div class="form-group">
                <label>Field ID (from clin_field_definitions)</label>
                <input type="number" id="fieldId" value="1">
            </div>
            <div class="form-group">
                <label>Label Override</label>
                <input type="text" id="fieldLabel" placeholder="Custom field label">
            </div>
            <div class="row">
                <div class="col form-group">
                    <label>Display Order</label>
                    <input type="number" id="fieldOrder" value="1">
                </div>
                <div class="col form-group">
                    <label>Required</label>
                    <select id="fieldRequired">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>UI Control</label>
                <select id="fieldUiControl">
                    <option value="input">Input</option>
                    <option value="textarea">Textarea</option>
                    <option value="select">Select</option>
                    <option value="datetime">DateTime</option>
                    <option value="checkbox">Checkbox</option>
                </select>
            </div>
            <button onclick="createTemplate()">Create Template</button>
            <button onclick="getTemplates()">List All Templates</button>
            <button onclick="getTemplate()">Get Template by ID</button>
            <div class="form-group" style="margin-top: 15px;">
                <label>Template ID</label>
                <input type="number" id="templateId" placeholder="Enter ID to fetch/delete">
            </div>
            <button onclick="deleteTemplate()">Delete Template</button>
            <div id="templateResponse" class="response"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/Clinical';

        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function saveVital() {
            const vital = {
                patientId: parseInt(document.getElementById('vitalPatientId').value),
                consultationId: document.getElementById('vitalConsultationId').value ? parseInt(document.getElementById('vitalConsultationId').value) : null,
                bpSystolic: document.getElementById('vitalBpSystolic').value ? parseInt(document.getElementById('vitalBpSystolic').value) : null,
                bpDiastolic: document.getElementById('vitalBpDiastolic').value ? parseInt(document.getElementById('vitalBpDiastolic').value) : null,
                heartRate: document.getElementById('vitalHeartRate').value ? parseInt(document.getElementById('vitalHeartRate').value) : null,
                temperature: document.getElementById('vitalTemperature').value ? parseFloat(document.getElementById('vitalTemperature').value) : null,
                spo2: document.getElementById('vitalSpo2').value ? parseInt(document.getElementById('vitalSpo2').value) : null
            };

            fetch(`${API_BASE}/vitals`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vital)
            })
            .then(r => r.json())
            .then(data => document.getElementById('vitalResponse').textContent = JSON.stringify(data, null, 2))
            .catch(e => document.getElementById('vitalResponse').textContent = 'Error: ' + e.message);
        }

        function getPatientVitals() {
            const patientId = document.getElementById('vitalPatientId').value;
            fetch(`${API_BASE}/patients/${patientId}/vitals`)
            .then(r => r.json())
            .then(data => document.getElementById('vitalResponse').textContent = JSON.stringify(data, null, 2))
            .catch(e => document.getElementById('vitalResponse').textContent = 'Error: ' + e.message);
        }

        function validateVitals() {
            const vital = {
                patientId: 1,
                bpSystolic: document.getElementById('valBpSystolic').value ? parseInt(document.getElementById('valBpSystolic').value) : null,
                bpDiastolic: document.getElementById('valBpDiastolic').value ? parseInt(document.getElementById('valBpDiastolic').value) : null,
                heartRate: document.getElementById('valHeartRate').value ? parseInt(document.getElementById('valHeartRate').value) : null,
                temperature: document.getElementById('valTemperature').value ? parseFloat(document.getElementById('valTemperature').value) : null,
                spo2: document.getElementById('valSpo2').value ? parseInt(document.getElementById('valSpo2').value) : null
            };

            fetch(`${API_BASE}/vitals/validate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vital)
            })
            .then(r => r.json())
            .then(data => {
                let html = '<h3>Validation Result</h3>';
                html += `<div class="alert ${data.overallPriority === 'High' ? 'critical' : data.overallPriority === 'Medium' ? 'warning' : 'normal'}">`;
                html += `<span class="alert-level">Overall Priority: ${data.overallPriority}</span></div>`;
                
                if (data.alerts && data.alerts.length > 0) {
                    data.alerts.forEach(alert => {
                        html += `<div class="alert ${alert.alertLevel === 'Critical' ? 'critical' : 'warning'}">`;
                        html += `<strong>${alert.field}</strong>: ${alert.alertLevel}<br>`;
                        html += `${alert.message}</div>`;
                    });
                } else {
                    html += '<div class="alert normal">All values within normal range</div>';
                }
                
                document.getElementById('validationResponse').innerHTML = html;
            })
            .catch(e => document.getElementById('validationResponse').textContent = 'Error: ' + e.message);
        }

        function getAlertRules() {
            fetch(`${API_BASE}/vitals/alert-rules`)
            .then(r => r.json())
            .then(data => {
                let html = '<h3>Alert Threshold Rules</h3>';
                data.forEach(rule => {
                    html += `<div class="alert ${rule.alertLevel === 'Critical' ? 'critical' : 'warning'}">`;
                    html += `<strong>${rule.field}</strong> ${rule.condition} ${rule.threshold}<br>`;
                    html += `<span class="alert-level">${rule.alertLevel}</span>: ${rule.message}</div>`;
                });
                document.getElementById('validationResponse').innerHTML = html;
            })
            .catch(e => document.getElementById('validationResponse').textContent = 'Error: ' + e.message);
        }

        function createTemplate() {
            const template = {
                title: document.getElementById('templateTitle').value,
                isActive: document.getElementById('templateActive').value === 'true',
                version: parseInt(document.getElementById('templateVersion').value),
                fields: [{
                    fieldId: parseInt(document.getElementById('fieldId').value),
                    labelOverride: document.getElementById('fieldLabel').value || null,
                    displayOrder: parseInt(document.getElementById('fieldOrder').value),
                    isRequired: document.getElementById('fieldRequired').value === 'true',
                    uiControl: document.getElementById('fieldUiControl').value
                }]
            };

            fetch(`${API_BASE}/templates`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(template)
            })
            .then(r => r.json())
            .then(data => document.getElementById('templateResponse').textContent = JSON.stringify(data, null, 2))
            .catch(e => document.getElementById('templateResponse').textContent = 'Error: ' + e.message);
        }

        function getTemplates() {
            fetch(`${API_BASE}/templates`)
            .then(r => r.json())
            .then(data => document.getElementById('templateResponse').textContent = JSON.stringify(data, null, 2))
            .catch(e => document.getElementById('templateResponse').textContent = 'Error: ' + e.message);
        }

        function getTemplate() {
            const id = document.getElementById('templateId').value;
            fetch(`${API_BASE}/templates/${id}`)
            .then(r => r.json())
            .then(data => document.getElementById('templateResponse').textContent = JSON.stringify(data, null, 2))
            .catch(e => document.getElementById('templateResponse').textContent = 'Error: ' + e.message);
        }

        function deleteTemplate() {
            const id = document.getElementById('templateId').value;
            fetch(`${API_BASE}/templates/${id}`, { method: 'DELETE' })
            .then(() => document.getElementById('templateResponse').textContent = 'Template deleted successfully')
            .catch(e => document.getElementById('templateResponse').textContent = 'Error: ' + e.message);
        }
    </script>
</body>
</html>
