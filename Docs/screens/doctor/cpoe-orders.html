<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPOE Orders - HMS Doctor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="../doctor-dashboard.html"
                class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-xl font-bold text-slate-800">Place Orders</h1>
        </div>
        <div class="text-sm font-medium text-slate-600">
            For: <span class="font-bold text-slate-900">John Doe (MRN-2024-001)</span>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 max-w-7xl mx-auto w-full">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 h-[calc(100vh-8rem)]">

            <!-- Catalog Column -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                <!-- Search -->
                <div class="relative">
                    <input type="text" placeholder="Search Medications, Labs, Imaging..."
                        class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none shadow-sm text-lg">
                    <svg class="w-6 h-6 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <!-- Categories/Favorites -->
                <div class="flex gap-2 overflow-x-auto pb-2">
                    <button
                        class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium whitespace-nowrap">Favorites</button>
                    <button
                        class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-50">Medications</button>
                    <button
                        class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-50">Labs</button>
                    <button
                        class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-50">Imaging</button>
                    <button
                        class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-lg text-sm font-medium whitespace-nowrap hover:bg-slate-50">Consults</button>
                </div>

                <!-- Results Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pr-2">
                    <!-- Item 1 -->
                    <div
                        class="p-4 bg-white border border-slate-200 rounded-xl hover:border-primary-500 hover:shadow-md cursor-pointer transition-all group">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-900 group-hover:text-primary-600">Amoxicillin 500mg Cap</h3>
                            <button class="text-primary-600 bg-blue-50 hover:bg-blue-100 p-2 rounded-lg"><svg
                                    class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4" />
                                </svg></button>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Antibiotic, Oral</p>
                    </div>
                    <!-- Item 2 -->
                    <div
                        class="p-4 bg-white border border-slate-200 rounded-xl hover:border-primary-500 hover:shadow-md cursor-pointer transition-all group">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-900 group-hover:text-primary-600">Lipid Panel</h3>
                            <button class="text-primary-600 bg-blue-50 hover:bg-blue-100 p-2 rounded-lg"><svg
                                    class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4" />
                                </svg></button>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Lab, Blood</p>
                    </div>
                    <!-- Item 3 -->
                    <div
                        class="p-4 bg-white border border-slate-200 rounded-xl hover:border-primary-500 hover:shadow-md cursor-pointer transition-all group">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-900 group-hover:text-primary-600">Atorvastatin 20mg Tab</h3>
                            <button class="text-primary-600 bg-blue-50 hover:bg-blue-100 p-2 rounded-lg"><svg
                                    class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4" />
                                </svg></button>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Statin, Oral</p>
                    </div>
                    <!-- Item 4 -->
                    <div
                        class="p-4 bg-white border border-slate-200 rounded-xl hover:border-primary-500 hover:shadow-md cursor-pointer transition-all group">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-900 group-hover:text-primary-600">XR Chest 2 Views</h3>
                            <button class="text-primary-600 bg-blue-50 hover:bg-blue-100 p-2 rounded-lg"><svg
                                    class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4" />
                                </svg></button>
                        </div>
                        <p class="text-xs text-slate-500 mt-1">Radiology, X-Ray</p>
                    </div>
                </div>
            </div>

            <!-- Basket Column -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h2 class="font-bold text-slate-800">Order Basket <span
                            class="ml-2 bg-primary-600 text-white text-xs px-2 py-0.5 rounded-full">2</span></h2>
                    <button class="text-xs text-red-600 hover:underline">Clear All</button>
                </div>

                <div class="flex-1 overflow-y-auto p-4 space-y-4">

                    <!-- Order 1 -->
                    <div class="p-3 border border-slate-200 rounded-lg">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-slate-900 text-sm">Amoxicillin 500mg</h4>
                            <button class="text-slate-400 hover:text-red-600"><svg class="w-4 h-4" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg></button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <input type="text" value="1 Capsule"
                                class="text-xs border border-slate-300 rounded px-2 py-1 w-full">
                            <select class="text-xs border border-slate-300 rounded px-2 py-1 w-full bg-white">
                                <option>BID (2x Daily)</option>
                                <option>TID (3x Daily)</option>
                                <option>QD (Daily)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" value="7 Days"
                                class="text-xs border border-slate-300 rounded px-2 py-1 w-full">
                            <div class="text-xs flex items-center text-slate-500">Qty: 14</div>
                        </div>
                    </div>

                    <!-- Order 2 -->
                    <div class="p-3 border border-slate-200 rounded-lg">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-slate-900 text-sm">Comprehensive Metabolic Panel</h4>
                            <button class="text-slate-400 hover:text-red-600"><svg class="w-4 h-4" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg></button>
                        </div>
                        <div class="grid grid-cols-1 gap-2">
                            <select class="text-xs border border-slate-300 rounded px-2 py-1 w-full bg-white">
                                <option>Routine</option>
                                <option>STAT</option>
                                <option>Urgent</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="p-4 border-t border-slate-100 bg-slate-50">
                    <button
                        class="w-full py-3 bg-green-600 text-white rounded-lg font-bold shadow-sm hover:bg-green-700 transition-colors flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Sign & Submit Orders
                    </button>
                </div>
            </div>

        </div>

    </main>
</body>

</html>
