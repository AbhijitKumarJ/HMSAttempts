<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - HMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="./user-management.html"
                class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-xl font-bold text-slate-800">Create / Edit User</h1>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 max-w-3xl mx-auto w-full">

        <form class="space-y-6">
            <!-- Basic Info -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">Basic Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                        <input type="text" placeholder="e.g. Sarah"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                        <input type="text" placeholder="e.g. Connor"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                        <input type="email" placeholder="e.g. sarah.c@hms.local"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Employee ID / Code</label>
                        <input type="text" placeholder="e.g. EMP-1011"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none">
                    </div>
                </div>
            </div>

            <!-- Role Mapping -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">Role Assignments</h2>
                <div class="space-y-3">
                    <label
                        class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer">
                        <input type="checkbox"
                            class="w-5 h-5 text-primary-600 rounded border-slate-300 focus:ring-primary-600">
                        <div>
                            <div class="font-medium text-slate-900">Administrator</div>
                            <div class="text-xs text-slate-500">Full system access. Use with caution.</div>
                        </div>
                    </label>
                    <label
                        class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer">
                        <input type="checkbox" checked
                            class="w-5 h-5 text-primary-600 rounded border-slate-300 focus:ring-primary-600">
                        <div>
                            <div class="font-medium text-slate-900">Doctor / Physician</div>
                            <div class="text-xs text-slate-500">Access to Clinical Cockpit, Prescriptions, Orders.</div>
                        </div>
                    </label>
                    <label
                        class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer">
                        <input type="checkbox"
                            class="w-5 h-5 text-primary-600 rounded border-slate-300 focus:ring-primary-600">
                        <div>
                            <div class="font-medium text-slate-900">Nurse</div>
                            <div class="text-xs text-slate-500">Access to Triage, Vitals, Administration Lists.</div>
                        </div>
                    </label>
                    <label
                        class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer">
                        <input type="checkbox"
                            class="w-5 h-5 text-primary-600 rounded border-slate-300 focus:ring-primary-600">
                        <div>
                            <div class="font-medium text-slate-900">Billing Clerk</div>
                            <div class="text-xs text-slate-500">Access to Invoices and Payments.</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Security -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-2">Security</h2>
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-medium text-slate-900">Force Password Reset</div>
                        <div class="text-xs text-slate-500">User will be prompted to change password on next login.
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="" class="sr-only peer" checked>
                        <div
                            class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-600">
                        </div>
                    </label>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4">
                <a href="./user-management.html"
                    class="px-6 py-2 border border-slate-300 bg-white text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition-colors">Cancel</a>
                <button type="button"
                    class="px-6 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 shadow-sm transition-colors">Save
                    User</button>
            </div>
        </form>

    </main>
</body>

</html>
