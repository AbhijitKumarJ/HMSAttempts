<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Dashboard - HMS Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                        semantic: { success: '#059669', warning: '#F59E0B', alert: '#DC2626' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </div>
            <span class="font-bold text-white text-lg">HMS Core</span>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-1">
            <a href="#"
                class="flex items-center px-4 py-3 bg-primary-600 text-white rounded-lg group transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                Triage Queue
            </a>
            <a href="#" class="flex items-center px-4 py-3 hover:bg-slate-800 rounded-lg group transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
                My Labs
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold">
                    AL</div>
                <div>
                    <div class="text-sm font-medium text-white">Alex L.</div>
                    <div class="text-xs text-slate-500">Nurse (RN)</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8">
            <h1 class="text-xl font-bold text-slate-800">Triage Station</h1>
            <div class="flex items-center gap-4">
                <!-- Role Switcher -->
                <div class="relative group">
                    <button
                        class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-200 bg-slate-50 hover:bg-white text-sm font-medium text-slate-700 transition-colors">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        Role: Nurse
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    <!-- Dropdown Mock -->
                    <div
                        class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-100 hidden group-hover:block z-50">
                        <div class="py-1">
                            <a href="./nurse-dashboard.html"
                                class="block px-4 py-2 text-sm font-medium text-primary-600 bg-blue-50">Nurse
                                (Active)</a>
                            <a href="./receptionist-dashboard.html"
                                class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Switch to Reception</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div class="flex-1 overflow-auto p-6 lg:p-8 bg-slate-50">
            <div class="grid grid-cols-12 gap-8 h-full">

                <!-- Patient List (Left) -->
                <div
                    class="col-span-4 flex flex-col h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-100 bg-slate-50">
                        <h2 class="font-bold text-slate-700">Pending Triage</h2>
                    </div>
                    <div class="overflow-y-auto flex-1 divide-y divide-slate-100">
                        <!-- Patient Active -->
                        <a href="./nurse/triage-assessment.html"
                            class="block p-4 bg-blue-50 border-l-4 border-primary-600 cursor-pointer">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-bold text-slate-900">John Doe</span>
                                <span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded font-medium">Chest
                                    Pain</span>
                            </div>
                            <div class="text-xs text-slate-500 mb-2">MRN-2024-001 • 38y Male</div>
                            <div class="text-xs text-slate-400">Wait: 12 mins</div>
                        </a>
                        <!-- Patient Item -->
                        <a href="./nurse/triage-assessment.html"
                            class="block p-4 hover:bg-slate-50 cursor-pointer border-l-4 border-transparent hover:border-slate-300 transition-colors">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-bold text-slate-900">Jane Smith</span>
                                <span
                                    class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-medium">Fever</span>
                            </div>
                            <div class="text-xs text-slate-500 mb-2">MRN-2024-042 • 24y Female</div>
                            <div class="text-xs text-slate-400">Wait: 5 mins</div>
                        </a>
                    </div>
                </div>

                <!-- Triage Form (Center/Right) -->
                <div
                    class="col-span-8 flex flex-col h-full bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <!-- Patient Banner -->
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">John Doe</h2>
                            <p class="text-sm text-slate-500">MRN-2024-001 • DOB: 12 Oct 1985 (38y)</p>
                        </div>
                        <div class="flex gap-2">
                            <button
                                class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">History</button>
                            <button
                                class="px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Allergies</button>
                        </div>
                    </div>

                    <!-- Vitals Grid -->
                    <div class="p-8 flex-1 overflow-y-auto">
                        <div class="grid grid-cols-2 gap-8 mb-8">
                            <!-- Temp -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Temperature (°C)</label>
                                <div class="relative">
                                    <input type="number" value="38.5"
                                        class="block w-full text-2xl font-bold p-3 rounded-lg border-2 border-orange-300 bg-orange-50 focus:ring-2 focus:ring-orange-500 outline-none text-slate-900">
                                    <span class="absolute right-4 top-4 text-orange-500 font-medium text-sm">High</span>
                                </div>
                            </div>
                            <!-- HR -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Heart Rate (bpm)</label>
                                <input type="number" value="98"
                                    class="block w-full text-2xl font-bold p-3 rounded-lg border-2 border-slate-200 focus:border-primary-600 focus:ring-2 focus:ring-primary-600 outline-none text-slate-900">
                            </div>
                            <!-- BP -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Blood Pressure
                                    (mmHg)</label>
                                <div class="flex gap-2 items-center">
                                    <input type="number" placeholder="Sys" value="145"
                                        class="w-full text-2xl font-bold p-3 rounded-lg border-2 border-red-300 bg-red-50 text-slate-900">
                                    <span class="text-slate-400 text-xl">/</span>
                                    <input type="number" placeholder="Dia" value="95"
                                        class="w-full text-2xl font-bold p-3 rounded-lg border-2 border-red-300 bg-red-50 text-slate-900">
                                </div>
                            </div>
                            <!-- O2 -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">O2 Saturation (%)</label>
                                <input type="number" value="98"
                                    class="block w-full text-2xl font-bold p-3 rounded-lg border-2 border-slate-200 focus:border-primary-600 focus:ring-2 focus:ring-primary-600 outline-none text-slate-900">
                            </div>
                        </div>

                        <!-- Notes -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Chief Complaint & Notes</label>
                            <textarea rows="4"
                                class="block w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary-600 outline-none text-sm leading-relaxed"
                                placeholder="Enter patient notes..."></textarea>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="p-6 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                        <button
                            class="px-6 py-2 border border-slate-300 bg-white text-slate-700 rounded-lg font-medium hover:bg-slate-50">Save
                            Draft</button>
                        <button
                            class="px-6 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 shadow-sm shadow-blue-500/30">Complete
                            Triage</button>
                    </div>

                </div>
            </div>
        </div>

    </main>
</body>

</html>
