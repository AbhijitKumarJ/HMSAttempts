<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HMS Core</title>

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            600: '#2563EB', // Blue-600
                            700: '#1D4ED8',
                        },
                        slate: {
                            50: '#F8FAFC',
                            200: '#E2E8F0',
                            800: '#1E293B',
                            900: '#0F172A', // Slate-900
                        },
                        semantic: {
                            alert: '#DC2626', // Red-600
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="font-sans text-slate-900 bg-slate-50 antialiased h-screen flex items-center justify-center selection:bg-primary-600 selection:text-white">

    <div class="w-full max-w-md px-6">

        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <span class="font-bold text-2xl tracking-tight text-slate-900">HMS Core</span>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-8">
                <h2 class="text-2xl font-bold text-center text-slate-900 mb-2">Welcome Back</h2>
                <p class="text-center text-slate-500 text-sm mb-8">Sign in to your clinical workspace</p>

                <form action="#" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email or
                            Username</label>
                        <input type="text" id="email"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 focus:border-primary-600 outline-none transition-all text-sm"
                            placeholder="dr.sarah@hospital.com">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                            <a href="#" class="text-xs font-medium text-primary-600 hover:text-primary-700">Forgot
                                password?</a>
                        </div>
                        <input type="password" id="password"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 focus:border-primary-600 outline-none transition-all text-sm"
                            placeholder="••••••••">
                    </div>

                    <button type="button"
                        class="w-full py-2.5 rounded-lg bg-primary-600 text-white font-semibold text-sm shadow-md shadow-blue-500/20 hover:bg-primary-700 hover:-translate-y-0.5 transition-all duration-200">
                        Sign In
                    </button>
                </form>

                <div class="mt-8 relative">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-slate-500">Critical Access</span>
                    </div>
                </div>

                <div class="mt-6">
                    <button type="button"
                        class="w-full group relative flex items-center justify-center py-2.5 rounded-lg border-2 border-red-100 bg-red-50 text-red-700 font-semibold text-sm hover:bg-red-100 hover:border-red-200 transition-all duration-200">
                        <span class="absolute left-4 flex h-3 w-3">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                        Emergency Access
                    </button>
                    <p class="mt-2 text-center text-xs text-slate-400">
                        For rapid patient registration only. No clinical history access.
                    </p>
                </div>
            </div>

            <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    Need an account? <a href="#" class="font-medium text-primary-600 hover:text-primary-500">Contact IT
                        Support</a>
                </p>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400 mt-8">
            &copy; 2026 HMS Core Project. Secure System.
        </p>

    </div>

</body>

</html>
