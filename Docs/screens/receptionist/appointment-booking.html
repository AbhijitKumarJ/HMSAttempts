<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - HMS Reception</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="../receptionist-dashboard.html"
                class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-xl font-bold text-slate-800">Book Appointment</h1>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 max-w-6xl mx-auto w-full">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Panel: Context -->
            <div class="space-y-6">
                <!-- Patient Search/Selection -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4">Select Patient</h2>
                    <div class="relative mb-4">
                        <input type="text" placeholder="Search Name or MRN..."
                            class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>

                    <!-- Selected Patient Card (Mock) -->
                    <div class="p-4 bg-blue-50 border border-blue-100 rounded-lg">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-slate-900">John Doe</h3>
                            <button class="text-xs text-blue-600 hover:underline">Change</button>
                        </div>
                        <p class="text-sm text-slate-600">MRN-2024-001</p>
                        <div class="mt-2 text-xs text-slate-500">
                            <div>DOB: 12/10/1985 (38y)</div>
                            <div>Ph: (555) 123-4567</div>
                        </div>
                    </div>
                </div>

                <!-- Provider Selection -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide mb-4">Provider & Service</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Department</label>
                            <select
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none bg-white">
                                <option>General Practice</option>
                                <option>Cardiology</option>
                                <option>Pediatrics</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Provider</label>
                            <select
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none bg-white">
                                <option>Any Available</option>
                                <option>Dr. Sarah Connor (GP)</option>
                                <option>Dr. Kyle Reese (Cardio)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Service Type</label>
                            <select
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none bg-white">
                                <option>Standard Consult (15m)</option>
                                <option>Detailed Exam (30m)</option>
                                <option>Urgent Visit (15m)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Calendar & Slots -->
            <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col h-[600px]">
                <!-- Calendar Toolbar -->
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <button class="p-1 hover:bg-slate-100 rounded text-slate-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h2 class="font-bold text-slate-800 text-lg">January 2026</h2>
                        <button class="p-1 hover:bg-slate-100 rounded text-slate-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                    <div class="flex bg-slate-100 p-1 rounded-lg">
                        <button
                            class="px-3 py-1 bg-white rounded shadow-sm text-sm font-medium text-slate-900">Day</button>
                        <button class="px-3 py-1 text-sm font-medium text-slate-500 hover:text-slate-900">Week</button>
                    </div>
                </div>

                <!-- Slots Grid (Mock) -->
                <div class="flex-1 overflow-auto p-6">
                    <div class="space-y-6">
                        <!-- Morning -->
                        <div>
                            <h3 class="text-xs font-bold text-slate-500 uppercase mb-3">Morning (09:00 - 12:00)</h3>
                            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">09:00
                                    AM</button>
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">09:15
                                    AM</button>
                                <button disabled
                                    class="py-2 px-1 text-center border border-slate-100 rounded bg-slate-50 text-slate-300 cursor-not-allowed text-sm decoration-slate-300 line-through">09:30
                                    AM</button>
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">09:45
                                    AM</button>
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">10:00
                                    AM</button>
                                <button
                                    class="py-2 px-1 text-center border border-primary-600 rounded bg-primary-600 text-white shadow-sm ring-2 ring-primary-100 text-sm font-bold">10:15
                                    AM</button>
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">10:30
                                    AM</button>
                            </div>
                        </div>

                        <!-- Afternoon -->
                        <div>
                            <h3 class="text-xs font-bold text-slate-500 uppercase mb-3">Afternoon (13:00 - 17:00)</h3>
                            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">01:00
                                    PM</button>
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">01:15
                                    PM</button>
                                <button
                                    class="py-2 px-1 text-center border border-slate-200 rounded hover:border-primary-600 hover:bg-blue-50 hover:text-primary-600 transition-all text-sm font-medium text-slate-700">01:30
                                    PM</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer Summary -->
                <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                    <div>
                        <span class="block text-xs text-slate-500 uppercase font-bold">Selected Slot</span>
                        <span class="font-bold text-slate-900">Jan 4, 2026 @ 10:15 AM</span>
                    </div>
                    <button
                        class="px-6 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 shadow-sm transition-colors">Confirm
                        Booking</button>
                </div>

            </div>

        </div>

    </main>
</body>

</html>
