<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Patient Registration - HMS Reception</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="../receptionist-dashboard.html"
                class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-xl font-bold text-slate-800">New Patient Registration</h1>
        </div>
        <div class="flex gap-3">
            <button
                class="px-4 py-2 border border-red-200 bg-red-50 text-red-700 rounded-lg text-sm font-medium hover:bg-red-100">Emergency
                Quick-Reg</button>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 max-w-4xl mx-auto w-full">

        <form class="space-y-6">

            <!-- Section 1: Demographics -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                    <span
                        class="w-6 h-6 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center text-xs">1</span>
                    Demographics
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Middle Name</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Date of Birth</label>
                        <input type="date"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-slate-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Gender</label>
                        <select
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none bg-white">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                            <option>Decline to Specify</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">SSN / National ID</label>
                        <input type="text" placeholder="XXX-XX-XXXX"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                </div>
            </div>

            <!-- Section 2: Contact Info -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                    <span
                        class="w-6 h-6 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center text-xs">2</span>
                    Contact Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
                        <input type="tel"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                        <input type="email"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Street Address</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">City</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">State</label>
                            <select
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none bg-white">
                                <option>CA</option>
                                <option>NY</option>
                                <option>TX</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Zip Code</label>
                            <input type="text"
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section 3: Insurance -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                    <span
                        class="w-6 h-6 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center text-xs">3</span>
                    Insurance & Billing
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Payer / Insurance Co.</label>
                        <select
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none bg-white">
                            <option>Self Pay</option>
                            <option>Blue Cross Blue Shield</option>
                            <option>Aetna</option>
                            <option>Medicare</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Policy Number</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Group Number</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Policy Holder (if
                            different)</label>
                        <input type="text"
                            class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-6 pb-20">
                <a href="../receptionist-dashboard.html"
                    class="px-6 py-3 border border-slate-300 bg-white text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition-colors">Cancel</a>
                <button type="button"
                    class="px-8 py-3 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 shadow-lg shadow-blue-500/30 transition-all hover:-translate-y-0.5">Register
                    Patient</button>
            </div>
        </form>

    </main>
</body>

</html>
