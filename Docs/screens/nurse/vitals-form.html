<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitals Entry - HMS Nurse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="../nurse-dashboard.html"
                class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-xl font-bold text-slate-800">Capture Vitals</h1>
        </div>
        <div class="text-sm font-medium text-slate-600">
            Patient: <span class="font-bold text-slate-900">John Doe (MRN-2024-001)</span>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 max-w-4xl mx-auto w-full">

        <form class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Vital Signs -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-2">
                    <h2 class="text-lg font-bold text-slate-900 mb-6">Vital Signs</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Temperature (°F)</label>
                            <div class="relative">
                                <input type="number" step="0.1" placeholder="98.6"
                                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-lg font-mono">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Heart Rate (bpm)</label>
                            <div class="relative">
                                <input type="number" placeholder="72"
                                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-lg font-mono">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Resp. Rate (bpm)</label>
                            <div class="relative">
                                <input type="number" placeholder="16"
                                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-lg font-mono">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">O2 Saturation (%)</label>
                            <div class="relative">
                                <input type="number" placeholder="98"
                                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-lg font-mono">
                            </div>
                        </div>

                        <div class="sm:col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-2">Blood Pressure (mmHg)</label>
                            <div class="flex gap-2 items-center">
                                <input type="number" placeholder="120"
                                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-lg font-mono text-center">
                                <span class="text-slate-400 font-bold">/</span>
                                <input type="number" placeholder="80"
                                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none text-lg font-mono text-center">
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Anthropometrics -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-2">
                    <h2 class="text-lg font-bold text-slate-900 mb-6">Anthropometrics</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Height (cm)</label>
                            <input type="number" placeholder="175"
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Weight (kg)</label>
                            <input type="number" step="0.1" placeholder="70.5"
                                class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Calculated BMI</label>
                            <input type="text" value="23.0" readonly
                                class="w-full px-4 py-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-500 outline-none font-medium cursor-not-allowed">
                        </div>
                    </div>
                </div>

                <!-- Notes -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-2">
                    <h2 class="text-lg font-bold text-slate-900 mb-4">Observation Notes</h2>
                    <textarea
                        class="w-full h-32 px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-600 outline-none resize-none"
                        placeholder="Enter any specific observations e.g. Patient appears anxious..."></textarea>
                </div>

            </div>

            <div class="flex items-center justify-end gap-3 pt-4">
                <a href="../nurse-dashboard.html"
                    class="px-6 py-3 border border-slate-300 bg-white text-slate-700 rounded-lg font-medium hover:bg-slate-50 transition-colors">Discard</a>
                <button type="button"
                    class="px-8 py-3 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 shadow-lg shadow-blue-500/30 transition-all hover:-translate-y-0.5">Save
                    Vitals</button>
            </div>

        </form>

    </main>
</body>

</html>
