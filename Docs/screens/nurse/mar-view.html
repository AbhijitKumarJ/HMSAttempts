<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR - HMS Nurse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 600: '#2563EB', 700: '#1D4ED8' },
                        slate: { 50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1', 800: '#1E293B', 900: '#0F172A' },
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header
        class="h-16 bg-white border-b border-slate-200 flex justify-between items-center px-6 lg:px-8 flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="../nurse-dashboard.html"
                class="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-xl font-bold text-slate-800">Medication Administration Record</h1>
        </div>
        <div class="text-sm font-medium text-slate-600">
            Patient: <span class="font-bold text-slate-900">Robert Williams (MRN-2024-089)</span>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 max-w-5xl mx-auto w-full">

        <!-- Due Now Section -->
        <h2 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">Due Now (09:00 - 11:00)</h2>
        <div class="space-y-4 mb-12">

            <!-- Med Item 1 -->
            <div
                class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row">
                <div
                    class="p-4 md:w-16 bg-red-50 flex items-center justify-center border-b md:border-b-0 md:border-r border-red-100">
                    <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div class="p-6 flex-1">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold text-slate-900">Amoxicillin <span
                                class="text-slate-500 font-medium">500mg</span></h3>
                        <span class="px-2 py-1 bg-red-100 text-red-800 text-xs font-bold rounded">Due 09:00 AM</span>
                    </div>
                    <p class="text-slate-600 text-sm mb-4">Oral, Capsule. Take with food.</p>

                    <div class="flex items-center gap-4">
                        <button
                            class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 shadow-sm">Administer</button>
                        <button
                            class="px-4 py-2 border border-slate-300 bg-white text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Not
                            Given</button>
                    </div>
                </div>
            </div>

            <!-- Med Item 2 -->
            <div
                class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row">
                <div
                    class="p-4 md:w-16 bg-blue-50 flex items-center justify-center border-b md:border-b-0 md:border-r border-blue-100">
                    <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </div>
                <div class="p-6 flex-1">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold text-slate-900">Metoprolol <span
                                class="text-slate-500 font-medium">25mg</span></h3>
                        <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs font-bold rounded">Due 10:00
                            AM</span>
                    </div>
                    <p class="text-slate-600 text-sm mb-4">Oral, Tablet.</p>

                    <div class="flex items-center gap-4">
                        <button
                            class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 shadow-sm">Administer</button>
                        <button
                            class="px-4 py-2 border border-slate-300 bg-white text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Not
                            Given</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Upcoming -->
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Upcoming</h2>
        <div class="opacity-75">
            <div class="bg-slate-50 rounded-xl border border-slate-200 p-6 flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-slate-700">Ibuprofen 400mg</h3>
                    <p class="text-sm text-slate-500">PRN - Pain</p>
                </div>
                <span class="text-sm text-slate-400 font-medium">Next Dose: 14:00 PM</span>
            </div>
        </div>

    </main>
</body>

</html>
